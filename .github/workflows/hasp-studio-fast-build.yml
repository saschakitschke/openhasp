name: HASP Studio Fast Build

on:
  push:
    branches:
      - hasp-studio
    paths-ignore:
      - "**.md"
      - "**.yml"
  workflow_dispatch:

jobs:
  build_guition_esp32:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio dulwich

      - name: Enable ESP32 platforms from platformio_override-template.ini
        run: |
          sed 's/; user_setups\/esp32/user_setups\/esp32/g' platformio_override-template.ini > platformio_override.ini

      - name: List all files in current folder
        run: |
          ls -la

      - name: Cat platformio_override.ini
        run: |
          cat platformio_override.ini

      - name: Build Guition ESP32-S3-4848S040 16MB
        run: pio run -e esp32-s3-4848s040_16MB

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: hasp-studio-guition-4848s040-16MB
          path: build_output/firmware/*.*
